<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — MechVerse</title>
<link rel="stylesheet" href="css/style.css" />
<style>
html, body { height: 100%; }
body {
  display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  background: radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--primary) 16%, transparent) 0%, transparent 60%), var(--bg);
}
.reset-wrap { width: 100%; max-width: 400px; }
.reset-logo { display: flex; justify-content: center; margin-bottom: 22px; }
.reset-logo img { width: 56px; height: 56px; border-radius: 14px; }

@keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.reset-card { animation: cardIn .4s ease both; padding: 32px 32px 28px; }

@keyframes shake {
  10%, 90% { transform: translateX(-1px); }
  20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-4px); }
  40%, 60% { transform: translateX(4px); }
}
.shake { animation: shake .5s ease; }

.pw-field { position: relative; }
.input-icon-wrap { position: relative; }
.input-icon-wrap input { padding-right: 40px; }
.pw-toggle {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none;
  cursor: pointer; color: var(--ink-soft); padding: 4px; display: flex; align-items: center;
}
.pw-toggle:hover { color: var(--primary); }

.pw-hint { font-size: 12px; color: var(--ink-soft); margin: -10px 0 16px; }
.pw-hint.ok { color: var(--success); }
.pw-hint.bad { color: var(--danger); }

.spinner {
  width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
  border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; margin-right: 8px; vertical-align: -2px;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.switch-form-link { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 16px 0 0; }
.switch-form-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
.switch-form-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="reset-wrap">
  <div class="reset-logo"><img src="assets/logo.png" alt="MechVerse" /></div>

  <div class="card bracket reset-card" id="authCard">
    <div id="formState">
      <h2 style="font-size:21px; margin-bottom:4px;">Set a new password</h2>
      <p class="muted" style="margin-bottom:22px;">Choose a new password for your account. It must be at least 8 characters.</p>

      <div id="errorBox" class="alert alert-error hidden"></div>
      <div id="successBox" class="alert alert-success hidden"></div>

      <form id="resetForm">
        <div class="field pw-field">
          <label>New password</label>
          <div class="input-icon-wrap">
            <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="newPassword" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field pw-field">
          <label>Confirm new password</label>
          <div class="input-icon-wrap">
            <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <p id="matchHint" class="pw-hint hidden"></p>

        <button class="btn btn-primary btn-block" type="submit" id="resetSubmitBtn">Reset password</button>
        <p class="switch-form-link"><a href="index.html">Back to log in</a></p>
      </form>
    </div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
// Read the token from the URL hash (#token=...), not the query string.
// Fragments never reach the server, so no dev-server redirect can ever
// strip them -- see the comment in authController.js for why this matters.
const token = new URLSearchParams(location.hash.replace(/^#/, '')).get('token');
const authCard = document.getElementById('authCard');
const form = document.getElementById('resetForm');
const errorBox = document.getElementById('errorBox');
const successBox = document.getElementById('successBox');
const btn = document.getElementById('resetSubmitBtn');
const newPassword = document.getElementById('newPassword');
const confirmPassword = document.getElementById('confirmPassword');
const matchHint = document.getElementById('matchHint');

if (!token) {
  // Show exactly what URL the browser actually landed on -- if the query
  // string is missing here, something between the email and this page
  // (link rewriting, a redirect, etc.) dropped it before we ever saw it,
  // which is useful to know when troubleshooting.
  showError(errorBox, `This reset link is missing its token. Request a new one from the login page. (Debug: the browser loaded this page at "${location.href}" — if that doesn't end in ?token=..., something stripped it before it reached this page. Try copying the full link from the email and pasting it directly into the address bar instead of clicking it.)`);
  btn.disabled = true;
}

document.querySelectorAll('.pw-toggle').forEach(toggleBtn => {
  toggleBtn.addEventListener('click', () => {
    const input = document.getElementById(toggleBtn.dataset.target);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });
});

// Live "do these match" feedback as the person types, rather than only
// finding out after they hit submit.
function checkMatch() {
  if (!confirmPassword.value) { matchHint.classList.add('hidden'); return; }
  matchHint.classList.remove('hidden');
  if (newPassword.value === confirmPassword.value) {
    matchHint.textContent = 'Passwords match.';
    matchHint.className = 'pw-hint ok';
  } else {
    matchHint.textContent = "Passwords don't match yet.";
    matchHint.className = 'pw-hint bad';
  }
}
newPassword.addEventListener('input', checkMatch);
confirmPassword.addEventListener('input', checkMatch);

function shakeEl(el) {
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.add('hidden');

  if (newPassword.value.length < 8) {
    showError(errorBox, 'Password must be at least 8 characters.');
    shakeEl(authCard);
    return;
  }
  if (newPassword.value !== confirmPassword.value) {
    showError(errorBox, "Those passwords don't match. Please re-enter them.");
    shakeEl(authCard);
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Resetting…`;
  try {
    await api('/auth/reset-password', { method: 'POST', body: { token, password: newPassword.value } });
    form.classList.add('hidden');
    successBox.textContent = 'Password updated! Redirecting you to log in…';
    successBox.classList.remove('hidden');
    setTimeout(() => { window.location.href = 'index.html'; }, 1600);
  } catch (err) {
    showError(errorBox, err.message);
    shakeEl(authCard);
    btn.disabled = false;
    btn.textContent = 'Reset password';
  }
});
</script>
</body>
</html>
